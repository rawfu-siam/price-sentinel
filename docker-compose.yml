version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: price-sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinel-net

  web:
    build: .
    container_name: price-sentinel-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./price_sentinel.db
      - TARGET_URL=${TARGET_URL:-https://example.com/products}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinel-net
    restart: unless-stopped

networks:
  sentinel-net:
    driver: bridge
